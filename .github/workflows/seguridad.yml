name: Seguridad

on:
  pull_request:
    branches: [main]
  workflow_dispatch:        # también permite correrlo a mano desde la pestaña Actions

permissions:
  contents: read

jobs:
  escanear-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Generar APK
        run: eas build --platform android --profile preview --local --non-interactive --output app.apk

      - name: Escanear APK
        uses: ignacioaguayluz/apk-analyzer@main
        with:
          apk: app.apk
          fallar-en: ALTO

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reporte-seguridad
          path: reporte-seguridad.html
